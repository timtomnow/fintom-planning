<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="FinTom — open-source household financial planning. Model assets, liabilities, and cash flows with deterministic and Monte Carlo forecasts.">
  <title>FinTom</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="FinTom">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
  <script src="js/vendor/chart.umd.min.js"></script>
  <script src="js/vendor/marked.min.js"></script>
</head>
<body>
  <div id="app">
    <aside id="sidebar"></aside>
    <main id="main"></main>
  </div>
  <nav id="bottom-nav"></nav>
  <div id="modal-overlay"><div id="modal"></div></div>
  <div id="toast-container"></div>
  <script src="js/utils.js"></script>
  <script src="js/data.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/pages/dashboard.js"></script>
  <script src="js/pages/baselines.js"></script>
  <script src="js/pages/events.js"></script>
  <script src="js/pages/inputs.js"></script>
  <script src="js/pages/analysis.js"></script>
  <script src="js/pages/results.js"></script>
  <script src="js/pages/settings.js"></script>
  <script src="js/pages/v1/shell.js"></script>
  <script src="js/pages/v1/summary-components.js"></script>
  <script src="js/pages/v1/v1-samples.js"></script>
  <script src="js/pages/v1/v1-questionnaires.js"></script>
  <script src="js/pages/v1/workflows.js"></script>
  <script src="js/pages/v1/workflow-quickstart-family.js"></script>
  <script src="js/pages/v1/workflow-12month-plan.js"></script>
  <script src="js/pages/v1/workflow-build-edit-scenario.js"></script>
  <script src="js/pages/v1/get-started.js"></script>
  <script src="js/pages/v1/history.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
  </script>
  <!-- ttn-backup integration: see https://timtomnow.github.io/ttn-backup/ -->
  <script>
    window.TTNBackupAdapter = {
      appId: 'fintom-planning',
      appName: 'FinTom Financial Planning',
      version: 1,
      exportData: () => state.data,
      importData: (data) => {
        if (!data || typeof data !== 'object'
            || !Array.isArray(data.baselines)
            || !Array.isArray(data.events)
            || !Array.isArray(data.analysisConfigs)) {
          throw new Error('Bundle payload missing required FinTom fields.');
        }
        state.data = data;
        state.data.eventSets = state.data.eventSets ?? [];
        state.data.workflows = state.data.workflows ?? [];
        state.lastRun = null;
        state.lastRunConfig = null;
        saveData();
        navigate(typeof V1_LANDING_PAGE === 'string' ? V1_LANDING_PAGE : 'dashboard');
        showToast('Data restored from ttn-backup', 'success');
      },
    };
  </script>
  <script src="../ttn-backup/client.js" defer></script>
</body>
</html>
